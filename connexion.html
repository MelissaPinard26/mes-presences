<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Au fil des accueils</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cream: #f7f3ec;
      --beige: #e8ddcc;
      --brown: #725744;
      --dark: #45372d;
      --sage: #87977b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--dark);
      background: linear-gradient(135deg, var(--cream), #e9e4d8);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 38px 30px;
      background: #fffdf9;
      border: 1px solid var(--beige);
      border-radius: 22px;
      box-shadow: 0 12px 35px #45372d12;
    }

    .leaf {
      font-size: 30px;
      text-align: center;
    }

    h1 {
      margin: 12px 0;
      color: var(--brown);
      text-align: center;
      font-size: 29px;
    }

    .subtitle {
      margin-bottom: 28px;
      text-align: center;
      line-height: 1.6;
      color: #766b60;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8cbb9;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: 2px solid var(--sage);
      border-color: var(--sage);
    }

    button {
      width: 100%;
      margin-top: 17px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--sage);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      margin-top: 10px;
      background: var(--beige);
      color: var(--dark);
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      display: none;
    }

    #message.error {
      display: block;
      background: #f9e9e5;
      color: #8b3025;
    }

    #message.success {
      display: block;
      background: #edf3e8;
      color: #385333;
    }

    .note {
      margin-top: 22px;
      font-size: 12px;
      line-height: 1.5;
      color: #766b60;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="leaf">🌿</div>
    <h1>Au fil des accueils</h1>
    <p class="subtitle">
      Votre espace professionnel et familial,
      en toute simplicité.
    </p>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
        placeholder="votre@email.fr"
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Votre mot de passe"
      >

      <button id="loginButton" type="submit">
        Se connecter
      </button>

      <button
        class="secondary"
        id="forgotButton"
        type="button"
      >
        Mot de passe oublié
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="note">
      Les inscriptions professionnelles et l'accès des parents
      seront activés dans une prochaine étape.
    </p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://xbdrgjzfflvmgelnkapv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_dUTbL15GMqZ-ZRE6KLAcyA_6WYacWpY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
  message.style.display = "block";
  message.style.whiteSpace = "pre-wrap";
}

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Connexion en cours…";
      message.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

     if (error) {
        showMessage("Connexion impossible : " + error.message, "error");
        return;
      }

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("role, full_name")
          .eq("id", data.user.id)
          .maybeSingle();

      if (profileError) {
        showMessage(
          "Erreur de lecture du profil : " + profileError.message,
          "error"
        );
        return;
      }

      if (!profile) {
        showMessage("Aucun profil trouvé pour cet utilisateur.", "error");
        return;
      }

        if (profile.role === "admin") {
          const { data: workspace, error: workspaceError } =
            await supabaseClient
              .from("professional_workspaces")
              .select("display_name")
              .eq("owner_user_id", data.user.id)
              .maybeSingle();

          if (workspaceError || !workspace) {
            showMessage(
              "Votre compte est reconnu, mais votre espace professionnel n'a pas pu être vérifié.",
              "error"
            );
            return;
          }

          showMessage(
            "Bonjour " + (profile.full_name || "Mélissa") +
            " ! Votre rôle administrateur est confirmé et votre espace " +
            workspace.display_name + " est retrouvé.",
            "success"
          );

        } else if (profile.role === "professional") {
          showMessage(
            "Votre compte professionnel est reconnu.",
            "success"
          );

        } else if (profile.role === "parent") {
          showMessage(
            "Votre compte parent est reconnu.",
            "success"
          );

        } else {
          showMessage(
            "Votre rôle n'est pas reconnu. Aucun espace ne sera ouvert.",
            "error"
          );
        }
      } catch (error) {
        showMessage(
          "Une erreur est survenue. Vérifiez votre connexion Internet.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Se connecter";
      }
    });

    document.getElementById("forgotButton")
      .addEventListener("click", async function() {
        const email = document.getElementById("email").value.trim();

        if (!email) {
          showMessage(
            "Saisissez d'abord votre adresse e-mail.",
            "error"
          );
          return;
        }

        try {
          const { error } =
            await supabaseClient.auth.resetPasswordForEmail(email, {
              redirectTo:
                "https://melissapinard26.github.io/mes-presences/connexion.html"
            });

          if (error) {
            showMessage(error.message, "error");
            return;
          }

          showMessage(
            "Si cette adresse correspond à un compte, " +
            "un e-mail de réinitialisation pourra être envoyé. " +
            "Vérifiez votre boîte de réception.",
            "success"
          );
        } catch (error) {
          showMessage(
            "Impossible de demander la réinitialisation pour le moment.",
            "error"
          );
        }
      });
  </script>
</body>
</html>
