<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Présences</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f3ed;
      color: #394238;
    }

    header {
      background: #dfe8dc;
      padding: 28px 20px 22px;
      border-radius: 0 0 28px 28px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      color: #657060;
    }

    main {
      padding: 20px;
      padding-bottom: 90px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .child-name {
      font-size: 20px;
      font-weight: 700;
    }

    .schedule {
      color: #70776d;
      margin: 6px 0 15px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .arrival {
      background: #dcebd8;
      color: #365337;
    }

    .departure {
      background: #eee9dc;
      color: #62583d;
    }

    .absent {
      background: #f1dddd;
      color: #793d3d;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #f7f7f4;
      font-size: 14px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #e4e4df;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
    }

    nav button {
      background: none;
      color: #697267;
      padding: 8px;
      font-size: 12px;
    }

    .title {
      margin-top: 8px;
      margin-bottom: 15px;
      font-size: 22px;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mes Présences</h1>
    <p id="date"></p>
  </header>

  <main>
    <h2 class="title">Aujourd'hui</h2>

    <div id="children"></div>
  </main>

  <nav>
    <button onclick="showToday()">🏠<br>Accueil</button>
    <button onclick="showChildren()">👶<br>Enfants</button>
    <button onclick="showCalendar()">📅<br>Calendrier</button>
    <button onclick="showSheets()">📄<br>Fiches</button>
  </nav>

  <script>

    let children = [
      {
        name: "Enfant exemple",
        schedule: "8h00 → 18h00",
        arrival: null,
        departure: null,
        absent: false
      }
    ];

    function displayDate() {
      const today = new Date();

      const options = {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      };

      document.getElementById("date").textContent =
        today.toLocaleDateString("fr-FR", options);
    }

    function displayChildren() {
      const container = document.getElementById("children");
      container.innerHTML = "";

      children.forEach((child, index) => {

        const card = document.createElement("div");
        card.className = "card";

        let status = "";

        if (child.absent) {
          status = "❌ Absent aujourd'hui";
        } else if (child.arrival && child.departure) {
          status = "✅ Présence enregistrée : " +
            child.arrival + " → " + child.departure;
        } else if (child.arrival) {
          status = "🟢 Arrivé à " + child.arrival;
        }

        card.innerHTML = `
          <div class="child-name">${child.name}</div>
          <div class="schedule">Prévu : ${child.schedule}</div>

          <div class="buttons">
            <button class="arrival"
              onclick="arrival(${index})">
              ARRIVÉE
            </button>

            <button class="departure"
              onclick="departure(${index})">
              DÉPART
            </button>

            <button class="absent"
              onclick="absence(${index})">
              ABSENT
            </button>
          </div>

          ${status ? `<div class="status">${status}</div>` : ""}
        `;

        container.appendChild(card);
      });
    }

    function currentTime() {
      return new Date().toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function arrival(index) {
      children[index].arrival = currentTime();
      children[index].absent = false;
      displayChildren();
    }

    function departure(index) {
      children[index].departure = currentTime();
      displayChildren();
    }

    function absence(index) {
      children[index].absent = true;
      children[index].arrival = null;
      children[index].departure = null;
      displayChildren();
    }

    function showToday() {
      document.querySelector("main").innerHTML = `
        <h2 class="title">Aujourd'hui</h2>
        <div id="children"></div>
      `;
      displayChildren();
    }

    function showChildren() {
      document.querySelector("main").innerHTML = `
        <h2 class="title">Mes enfants</h2>
        <div class="card">
          <div class="empty">
            👶<br><br>
            La gestion des enfants sera ajoutée ici.
            <br><br>
            Nous pourrons ensuite créer une fiche complète
            pour chaque contrat.
          </div>
        </div>
      `;
    }

    function showCalendar() {
      document.querySelector("main").innerHTML = `
        <h2 class="title">Calendrier</h2>
        <div class="card">
          <div class="empty">
            📅<br><br>
            Le calendrier des présences sera ajouté ici.
          </div>
        </div>
      `;
    }

    function showSheets() {
      document.querySelector("main").innerHTML = `
        <h2 class="title">Fiches de présence</h2>
        <div class="card">
          <div class="empty">
            📄<br><br>
            La génération des fiches mensuelles sera ajoutée ici.
          </div>
        </div>
      `;
    }

    displayDate();
    displayChildren();

  </script>

</body>
</html>
