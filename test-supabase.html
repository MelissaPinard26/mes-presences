<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test de connexion Supabase</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
      color: #333;
    }

    h1 {
      color: #536b50;
      font-size: 24px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      margin-top: 18px;
      border: none;
      border-radius: 6px;
      background: #536b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #deconnexion {
      background: #777;
      margin-left: 6px;
    }

    #resultat {
      margin-top: 24px;
      padding: 12px;
      background: #f2f4ef;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h1>Test de connexion Supabase</h1>

  <p>
    Cette page sert uniquement à tester la connexion.
    Elle ne modifie pas les données des enfants.
  </p>

  <form id="login-form">
    <label for="email">Adresse e-mail</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      required
    >

    <label for="password">Mot de passe</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button id="connexion" type="submit">
      Se connecter
    </button>

    <button id="deconnexion" type="button">
      Se déconnecter
    </button>
  </form>

  <p id="resultat" aria-live="polite">
    Vérification de la session...
  </p>

  <script>
    const SUPABASE_URL =
      "https://xbdrgjzfflvmgelnkapv.supabase.co";

    // Utilise ici ta clé publique sb_publishable_ déjà créée.
    // Ne mets surtout pas une clé secrète ou service_role.
    const SUPABASE_KEY =
      "sb_publishable_dUTbL15GMqZ-ZRE6KLAcyA_6WYacWpY";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const formulaire = document.getElementById("login-form");
    const champEmail = document.getElementById("email");
    const champMotDePasse = document.getElementById("password");
    const resultat = document.getElementById("resultat");
    const boutonConnexion = document.getElementById("connexion");
    const boutonDeconnexion = document.getElementById("deconnexion");

    async function verifierSession() {
      resultat.textContent = "Vérification en cours...";

      const { data, error } = await client.auth.getSession();

      if (error) {
        resultat.textContent =
          "Erreur de vérification : " + error.message;
        return;
      }

      if (data.session) {
        resultat.textContent =
          "Une session est ouverte pour " +
          (data.session.user.email || "cet utilisateur") + ".";
      } else {
        resultat.textContent = "Aucune session ouverte. Tu peux te connecter.";
      }
    }

    formulaire.addEventListener("submit", async function(event) {
      event.preventDefault();

      boutonConnexion.disabled = true;
      resultat.textContent = "Connexion en cours...";

      const { data, error } = await client.auth.signInWithPassword({
        email: champEmail.value.trim(),
        password: champMotDePasse.value
      });

      champMotDePasse.value = "";
      boutonConnexion.disabled = false;

      if (error) {
        resultat.textContent =
          "Échec de connexion : " + error.message;
        return;
      }

      resultat.textContent =
        "Connexion réussie pour " +
        (data.user.email || "cet utilisateur") + ".";
    });

    boutonDeconnexion.addEventListener("click", async function() {
      boutonDeconnexion.disabled = true;
      resultat.textContent = "Déconnexion en cours...";

      const { error } = await client.auth.signOut();

      boutonDeconnexion.disabled = false;

      if (error) {
        resultat.textContent =
          "Erreur de déconnexion : " + error.message;
        return;
      }

      resultat.textContent = "Déconnexion réussie.";
    });

    verifierSession();
  </script>
</body>
</html>
