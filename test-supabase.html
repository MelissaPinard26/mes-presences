<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification administrateur</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 35px auto;
      padding: 20px;
      color: #333;
    }

    h1 {
      color: #536b50;
      font-size: 24px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      margin-top: 18px;
      border: none;
      border-radius: 6px;
      background: #536b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #deconnexion {
      background: #777;
      margin-left: 6px;
    }

    #resultat {
      margin-top: 24px;
      padding: 14px;
      background: #f2f4ef;
      border-radius: 6px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Vérification du compte administrateur</h1>

  <p>
    Cette page vérifie la connexion et le profil du compte.
    Elle ne modifie aucune donnée des enfants.
  </p>

  <form id="login-form">
    <label for="email">Adresse e-mail</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      required
    >

    <label for="password">Mot de passe</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button id="connexion" type="submit">
      Se connecter et vérifier
    </button>

    <button id="deconnexion" type="button">
      Se déconnecter
    </button>
  </form>

  <p id="resultat" aria-live="polite">
    Vérification de la session...
  </p>

  <script>
    const SUPABASE_URL =
      "https://xbdrgjzfflvmgelnkapv.supabase.co";

    // Garde ici la même clé PUBLIQUE sb_publishable_ que précédemment.
    // N'utilise jamais une clé secrète ou service_role dans cette page.
    const SUPABASE_KEY =
      "sb_publishable_dUTbL15GMqZ-ZRE6KLAcyA_6WYacWpY";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const formulaire = document.getElementById("login-form");
    const champEmail = document.getElementById("email");
    const champMotDePasse = document.getElementById("password");
    const resultat = document.getElementById("resultat");
    const boutonConnexion = document.getElementById("connexion");
    const boutonDeconnexion = document.getElementById("deconnexion");

async function verifierProfil(utilisateur) {
  resultat.textContent =
    "Connexion réussie. Vérification des autorisations...";

  const { data: profil, error: erreurProfil } = await client
    .from("profiles")
    .select("id, full_name, role")
    .eq("id", utilisateur.id)
    .maybeSingle();

  if (erreurProfil) {
    resultat.textContent =
      "Connexion réussie, mais lecture du profil refusée.\n" +
      "Détail : " + erreurProfil.message;
    return;
  }

  if (!profil) {
    resultat.textContent =
      "Connexion réussie, mais aucun profil accessible n'a été trouvé.";
    return;
  }

  const { data: enfants, error: erreurEnfants } = await client
    .from("children")
    .select("id")
    .limit(5);

  let message =
    "CONNEXION RÉUSSIE\n\n" +
    "Rôle détecté : " + (profil.role || "non renseigné") + "\n";

  if (profil.role === "admin") {
    message += "Compte administrateur détecté.\n";
  } else {
    message += "Ce compte n'est pas administrateur.\n";
  }

  message += "\nTEST DE LECTURE DES ENFANTS\n";

  if (erreurEnfants) {
    message +=
      "Erreur lors de la lecture : " + erreurEnfants.message;
  } else {
    message +=
      "Requête autorisée. Nombre de lignes visibles : " +
      enfants.length + ".";
  }

  resultat.textContent = message;
}
    }

    formulaire.addEventListener("submit", async function(event) {
      event.preventDefault();

      boutonConnexion.disabled = true;
      resultat.textContent = "Connexion en cours...";

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: champEmail.value.trim(),
          password: champMotDePasse.value
        });

        champMotDePasse.value = "";

        if (error) {
          resultat.textContent =
            "Échec de connexion : " + error.message;
          return;
        }

        await verifierProfil(data.user);
      } catch (error) {
        resultat.textContent =
          "Une erreur inattendue est survenue : " + error.message;
      } finally {
        boutonConnexion.disabled = false;
      }
    });

    boutonDeconnexion.addEventListener("click", async function() {
      boutonDeconnexion.disabled = true;

      try {
        const { error } = await client.auth.signOut();

        if (error) {
          resultat.textContent =
            "Erreur de déconnexion : " + error.message;
          return;
        }

        resultat.textContent = "Déconnexion réussie.";
      } finally {
        boutonDeconnexion.disabled = false;
      }
    });

    async function verifierSession() {
      const { data, error } = await client.auth.getSession();

      if (error) {
        resultat.textContent =
          "Erreur de vérification : " + error.message;
        return;
      }

      if (data.session) {
        await verifierProfil(data.session.user);
      } else {
        resultat.textContent =
          "Aucune session ouverte. Connecte-toi pour vérifier le profil.";
      }
    }

    verifierSession();
  </script>
</body>
</html>
