<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification administrateur</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 35px auto;
      padding: 20px;
      color: #333;
    }

    h1 {
      color: #536b50;
      font-size: 24px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      margin-top: 18px;
      border: none;
      border-radius: 6px;
      background: #536b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #deconnexion {
      background: #777;
      margin-left: 6px;
    }

    #resultat {
      margin-top: 24px;
      padding: 14px;
      background: #f2f4ef;
      border-radius: 6px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Vérification du compte administrateur</h1>

  <p>
    Cette page vérifie la connexion et le profil du compte.
    Elle ne modifie aucune donnée des enfants.
  </p>

  <form id="login-form">
    <label for="email">Adresse e-mail</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      required
    >

    <label for="password">Mot de passe</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button id="connexion" type="submit">
      Se connecter et vérifier
    </button>

    <button id="deconnexion" type="button">
      Se déconnecter
    </button>
  </form>

  <p id="resultat" aria-live="polite">
    Vérification de la session...
  </p>

  <script>
    const SUPABASE_URL =
      "https://xbdrgjzfflvmgelnkapv.supabase.co";

    // Garde ici la même clé PUBLIQUE sb_publishable_ que précédemment.
    // N'utilise jamais une clé secrète ou service_role dans cette page.
    const SUPABASE_KEY =
      "sb_publishable_dUTbL15GMqZ-ZRE6KLAcyA_6WYacWpY";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const formulaire = document.getElementById("login-form");
    const champEmail = document.getElementById("email");
    const champMotDePasse = document.getElementById("password");
    const resultat = document.getElementById("resultat");
    const boutonConnexion = document.getElementById("connexion");
    const boutonDeconnexion = document.getElementById("deconnexion");

    async function verifierProfil(utilisateur) {
      resultat.textContent =
        "Connexion reconnue. Vérification du profil en cours...";

      const { data, error } = await client
        .from("profiles")
        .select("id, full_name, role")
        .eq("id", utilisateur.id)
        .maybeSingle();

      if (error) {
        resultat.textContent =
          "Connexion réussie, mais impossible de vérifier le profil.\n" +
          "Détail : " + error.message;
        return;
      }

      if (!data) {
        resultat.textContent =
          "Connexion réussie, mais aucun profil accessible n'a été trouvé.\n" +
          "Il faut vérifier le profil et les règles de sécurité.";
        return;
      }

      if (data.role === "admin") {
        resultat.textContent =
          "CONNEXION RÉUSSIE\n\n" +
          "Profil trouvé : " + (data.full_name || "Nom non renseigné") +
          "\nRôle détecté : administrateur\n\n" +
          "Le profil est accessible. Il reste à tester les autorisations réelles.";
      } else {
        resultat.textContent =
          "Connexion réussie.\n\n" +
          "Rôle détecté : " + (data.role || "non renseigné") +
          "\nCe compte n'est pas reconnu comme administrateur.";
      }
    }

    formulaire.addEventListener("submit", async function(event) {
      event.preventDefault();

      boutonConnexion.disabled = true;
      resultat.textContent = "Connexion en cours...";

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: champEmail.value.trim(),
          password: champMotDePasse.value
        });

        champMotDePasse.value = "";

        if (error) {
          resultat.textContent =
            "Échec de connexion : " + error.message;
          return;
        }

        await verifierProfil(data.user);
      } catch (error) {
        resultat.textContent =
          "Une erreur inattendue est survenue : " + error.message;
      } finally {
        boutonConnexion.disabled = false;
      }
    });

    boutonDeconnexion.addEventListener("click", async function() {
      boutonDeconnexion.disabled = true;

      try {
        const { error } = await client.auth.signOut();

        if (error) {
          resultat.textContent =
            "Erreur de déconnexion : " + error.message;
          return;
        }

        resultat.textContent = "Déconnexion réussie.";
      } finally {
        boutonDeconnexion.disabled = false;
      }
    });

    async function verifierSession() {
      const { data, error } = await client.auth.getSession();

      if (error) {
        resultat.textContent =
          "Erreur de vérification : " + error.message;
        return;
      }

      if (data.session) {
        await verifierProfil(data.session.user);
      } else {
        resultat.textContent =
          "Aucune session ouverte. Connecte-toi pour vérifier le profil.";
      }
    }

    verifierSession();
  </script>
</body>
</html>
